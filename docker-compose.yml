version: '3.8'

services:
  web: # Nome do serviço Django
    build: . # O contexto de build é o diretório atual (onde está o Dockerfile)
    image: api-skin # Nome da imagem Docker que será construída
    ports:
      - "8000:8000" # Mapeia a porta 8000 do host para a porta 8000 do contêiner
    environment: # Variáveis de ambiente para o contêiner 'web'
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db # O nome do serviço do banco de dados no docker-compose é 'db'
      DB_PORT: 5432
      DB_NAME: skin
      DB_USER: postgres
      DB_PASS: fpf2025 # Cuidado com senhas em arquivos de configuração! Use .env para produção.
      MINIO_ENDPOINT: minio-api:9000 # Endereço do MinIO (use o nome do serviço MinIO)
      MINIO_ACCESS_KEY: minio # Usuário raiz do MinIO
      MINIO_SECRET_KEY: minio123 # Senha raiz do MinIO
      USE_S3: True # Ativar o django-storages para S3/MinIO
      IA_API_URL: http://ai_service:5000/predict # <--- Adicionado: URL da API de IA
      # Adicione outras variáveis de ambiente se necessário (DEBUG, SECRET_KEY, etc.)
    depends_on:
      - db # O serviço 'web' depende do serviço 'db' para iniciar
      - minio-api # O serviço 'web' depende do serviço 'minio-api' para armazenamento
      - ai_service # <--- Adicionado: O serviço 'web' depende do serviço 'ai_service'
    volumes:
      - .:/app # Monta o diretório atual do seu projeto para o diretório /app dentro do contêiner.
    networks:
      - app-network # Conecta o serviço 'web' à rede personalizada
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    restart: on-failure

  db: # Nome do serviço PostgreSQL
    image: postgres:15
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=skin
      - POSTGRES_PASSWORD=fpf2025
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin-api-core: # Nome do serviço PgAdmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "14549:80"
    depends_on:
      - db
    networks:
      - app-network

  minio-api: # Nome do serviço MinIO
    hostname: minio-skin
    image: 'minio/minio:latest'
    container_name: minio # Nome do contêiner específico (opcional, mas definido)
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data-skin:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    networks:
      - app-network

  ai_service: # <--- NOVO SERVIÇO PARA A API DE IA
    build:
      context: . # O contexto de build é o diretório raiz do projeto
      dockerfile: ai_service/Dockerfile # O Dockerfile específico para a IA
    volumes:
      - ./ai_service:/app # Monta a pasta ai_service no contêiner
    ports:
      - "5000:5000" # Mapeia a porta 5000 do contêiner para a porta 5000 do host
    environment:
      PYTHONUNBUFFERED: 1 # Para logs em tempo real no Docker
    depends_on:
      - minio-api # <--- A IA precisa do MinIO para baixar as imagens
    networks:
      - app-network # Conecta o serviço 'ai_service' à rede personalizada

volumes:
  db-data: {}
  minio-data-skin: {}

networks:
  app-network:
    driver: bridge