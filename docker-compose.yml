services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-skin
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: django.db.backends.postgresql_psycopg2
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: skin
      DB_USER: postgres
      DB_PASS: fpf2025
    depends_on:
      - db

  ai_service:
    build:
      context: ./data/ai_service
      dockerfile: Dockerfile
    volumes:
    - ./data/ai_service:/app
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 1


  db:
    image: postgres:15
    ports:
      - "5435:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=skin
      - POSTGRES_PASSWORD=fpf2025
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin-api-core:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "14549:80"

  minio-api:
    hostname: minio-skin
    image: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
    container_name: minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data-skin:/data
    environment:
      MINIO_ROOT_USER: skin-health
      MINIO_ROOT_PASSWORD: fpf2025###
    command: server /data --console-address ":9001"

volumes:
  db-data: {}
  minio-data-skin: {}
